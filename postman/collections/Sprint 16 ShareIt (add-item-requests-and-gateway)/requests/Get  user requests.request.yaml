$kind: http-request
url: localhost:8080/requests
method: GET
headers:
  Content-Type: application/json
  X-Sharer-User-Id: "{{userId}}"
scripts:
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    try {\r

      \        user = await api.addUser(rnd.getUser());\r

      \        pm.collectionVariables.set(\"userId\", user.id);\r

      \        request1 = await api.addRequest(rnd.getRequest(), user.id);\r

      \        request2 = await api.addRequest(rnd.getRequest(), user.id);\r

      \r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      \r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.be.ok;\r

      });\r

      pm.test(\"User requests amount\", function () {\r

      \    pm.response.to.be.withBody;\r

      \    pm.response.to.be.json;\r

      \    var jsonData = pm.response.json();\r

      \    pm.expect(jsonData.length, 'List length must be 2').to.eql(2);\r

      });"
    language: text/javascript
order: 2000
