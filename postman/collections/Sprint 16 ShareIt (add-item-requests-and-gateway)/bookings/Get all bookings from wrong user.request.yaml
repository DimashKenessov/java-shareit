$kind: http-request
url: "{{baseUrl}}/bookings/owner"
method: GET
headers:
  X-Sharer-User-Id: "{{userId}}"
  Accept: "*/*"
scripts:
  - type: afterResponse
    code: |
      pm.test("Status code is 500", function () {
          pm.expect(pm.response.code).to.be.oneOf([500,404,403]);
      });
    language: text/javascript
  - type: beforeRequest
    code: "const main = async () => {\r

      \    const api = new API(pm);\r

      \    const rnd = new RandomUtils();\r

      \r

      \    try {\r

      \        user2 = await api.addUser(rnd.getUser());\r

      \        pm.collectionVariables.set(\"userId\", user2.id + 1);\r

      \r

      \r

      \    } catch(err) {\r

      \        console.error(\"Ошибка при подготовке тестовых данных.\", err);\r

      \    }\r

      \r

      };\r

      \r

      const interval = setInterval(() => {}, 1000);\r

      \r

      setTimeout(async () => \r

      \    {\r

      \        try {\r

      \            await main();\r

      \        } catch (e) {\r

      \            console.error(e);\r

      \        } finally {\r

      \            clearInterval(interval);\r

      \        }\r

      \    },  \r

      \    100 \r

      );"
    language: text/javascript
order: 14000
